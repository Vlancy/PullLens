[www]
; The official php-fpm image already sets this in docker.conf; it is restated here so
; the behaviour PullLens depends on is declared rather than inherited. PHP's own
; default is "yes", which strips the worker environment - a web request would then see
; none of the values Compose passes through env_file and the app would depend entirely
; on bootstrap/cache/config.php, which is written into the container's writable layer
; and lost whenever a container is recreated.
clear_env = no

; A liveness endpoint belonging to FPM itself, so nothing has to reach through the web
; tier to find out whether this process is alive.
ping.path = /ping
ping.response = pong
