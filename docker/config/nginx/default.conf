# Plain HTTP. This is the whole of PullLens's web tier until a certificate exists;
# afterwards install_tls.sh adds tls.conf beside this file, which claims the domain by
# name and leaves this server handling anything arriving by another name or by IP.

server {
    listen 80 default_server;
    server_name _;

    # Read by pulllens-app.inc, which passes it to PHP as the HTTPS server variable.
    # Empty here: a request that arrived on this server really did arrive over plain
    # HTTP, whatever the TLS server next door is doing.
    set $pulllens_https "";

    # Let's Encrypt writes its challenge file here and fetches it over plain HTTP. It
    # has to stay reachable on port 80 even after the redirect to HTTPS goes in, or
    # renewal fails 60 days later with the site apparently working fine.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/conf.d/pulllens-app.inc;
}
