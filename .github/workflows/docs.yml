name: Publish documentation

# Publishes docs/ to GitHub Pages so the user guide has a real URL. The guide is
# plain HTML with no build step, so the job only uploads the directory.
#
# Pages has to be switched on once, by hand, before this can publish anything:
#
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# configure-pages used to be asked to do that itself, through `enablement: true`.
# GITHUB_TOKEN is not allowed to create a Pages site on most repositories, so on
# a repository where Pages was never enabled it failed with an octokit stack
# trace and two errors that named neither the cause nor the fix. The preflight
# below checks the same thing and says what to do instead.

on:
  push:
    # main only. The github-pages environment is protected to the default
    # branch, so a push from any other branch is rejected at deploy time with
    # "Branch is not allowed to deploy to github-pages" - the job would fail
    # rather than publish. Use workflow_dispatch on main to republish by hand.
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify the guide is intact
        run: |
          test -f docs/guide/index.html || { echo "guide index missing"; exit 1; }

          # Every referenced image must exist, or the published page shows a
          # broken icon that nobody notices until a user reports it.
          missing=0
          for img in $(grep -ho 'src="\.\./images/guide/[^"]*"' docs/guide/*.html \
                       | sed 's/src="\.\.\///;s/"//' | sort -u); do
            if [ ! -f "docs/$img" ]; then echo "missing image: docs/$img"; missing=1; fi
          done

          # Same for internal links between guide pages.
          for page in $(grep -ho 'href="[a-z-]*\.html"' docs/guide/*.html \
                        | sed 's/href="//;s/"//' | sort -u); do
            if [ ! -f "docs/guide/$page" ]; then echo "missing page: $page"; missing=1; fi
          done

          exit $missing

      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            exit 0
          fi

          echo "::error title=GitHub Pages is not enabled::Open Settings -> Pages -> Build and deployment and set Source to \"GitHub Actions\", then re-run this workflow."
          exit 1

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
