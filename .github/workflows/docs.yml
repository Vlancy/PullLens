name: Publish documentation

# Publishes docs/ to GitHub Pages so the user guide has a real URL. The guide is
# plain HTML with no build step, so the job only uploads the directory.
#
# configure-pages runs with `enablement: true`, so it turns Pages on through the
# API on the first run rather than requiring anyone to change a repository
# setting by hand. That needs the `pages: write` permission granted below.
#
# If your organisation blocks Actions from enabling Pages, the first run fails
# with "Get Pages site failed" and somebody has to set it once:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

on:
  push:
    # main only. The github-pages environment is protected to the default
    # branch, so a push from any other branch is rejected at deploy time with
    # "Branch is not allowed to deploy to github-pages" — the job would fail
    # rather than publish. Use workflow_dispatch on main to republish by hand.
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify the guide is intact
        run: |
          test -f docs/guide/index.html || { echo "guide index missing"; exit 1; }

          # Every referenced image must exist, or the published page shows a
          # broken icon that nobody notices until a user reports it.
          missing=0
          for img in $(grep -ho 'src="\.\./images/guide/[^"]*"' docs/guide/*.html \
                       | sed 's/src="\.\.\///;s/"//' | sort -u); do
            if [ ! -f "docs/$img" ]; then echo "missing image: docs/$img"; missing=1; fi
          done

          # Same for internal links between guide pages.
          for page in $(grep -ho 'href="[a-z-]*\.html"' docs/guide/*.html \
                        | sed 's/href="//;s/"//' | sort -u); do
            if [ ! -f "docs/guide/$page" ]; then echo "missing page: $page"; missing=1; fi
          done

          exit $missing

      - uses: actions/configure-pages@v6
        with:
          # Enable Pages on first run instead of failing until it is switched on
          # by hand in the repository settings.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
