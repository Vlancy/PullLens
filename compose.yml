# PullLens Docker Compose stack.
# This file runs the production PullLens application stack.
#
# The application image is published at https://hub.docker.com/r/vlancy/pulllens, so an
# install pulls it rather than compiling it. `docker compose up -d` uses the published
# image; `docker compose up -d --build` still compiles the tree you have checked out,
# which is what a contributor working on the app itself wants. Pin PULLLENS_VERSION in
# .env to hold a release still; unset, it follows `latest`.
x-laravel-image: &laravel-image
  image: ${PULLLENS_IMAGE:-vlancy/pulllens}:${PULLLENS_VERSION:-latest}
  # Stated rather than inferred. With both `image:` and `build:` present Compose has to
  # guess, and the guess changes with the version; `missing` pulls only what is not
  # already here, and install.sh sets `build` for a source install.
  pull_policy: ${PULLLENS_PULL_POLICY:-missing}

x-laravel-build: &laravel-build
  build:
    context: .
    dockerfile: docker/services/laravel/Dockerfile
    target: production
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      PULLLENS_RELEASE: ${PULLLENS_VERSION:-source}

x-laravel-env: &laravel-env
  env_file:
    - .env

services:
  # The published image carries the compiled frontend, but Nginx serves those files from
  # its own filesystem. This one-shot service copies them into a volume Nginx mounts and
  # then exits; Nginx waits for it to finish, so it can never serve a half-populated
  # document root. The copy replaces rather than merges: the volume outlives an upgrade,
  # and a stale manifest.json left behind by the previous version would point the browser
  # at asset filenames the new one no longer ships.
  assets:
    # Carries the build block as well: this is the same image as `app`, and a source
    # install sets pull_policy to `build`, which a service with nothing to build
    # cannot satisfy.
    <<: [*laravel-image, *laravel-build]
    container_name: pulllens-assets
    command: pulllens-publish-assets
    volumes:
      # Mounted at /mnt/public rather than over the image's own public/: a named
      # volume mounted onto a populated image path is silently seeded from it the
      # first time, which would mask a broken sync until the first upgrade.
      - pulllens_public:/mnt/public
    restart: "no"
    networks:
      - pulllens

  # Nginx is the public HTTP entrypoint and forwards PHP requests to the Laravel PHP-FPM container.
  nginx:
    image: nginx:alpine
    container_name: pulllens-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - pulllens_public:/var/www/html/public:ro
      - ./docker/config/nginx:/etc/nginx/conf.d:ro
      - pulllens_certs:/etc/letsencrypt:ro
      - pulllens_acme:/var/www/certbot:ro
    # A renewed certificate is written by the certbot container and only takes effect
    # when Nginx reloads, which nothing else would ever tell it to do. Reloading on a
    # timer is cheap and drops no connections; the certificate is good for 90 days and
    # renewal starts at 30, so twice a day is ample.
    command: >
      sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      assets:
        condition: service_completed_successfully
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pulllens

  # Laravel PHP-FPM runtime for handling web requests through Nginx.
  app:
    <<: [*laravel-env, *laravel-image, *laravel-build]
    container_name: pulllens-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - pulllens_storage:/var/www/html/storage
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Checks the FPM listener itself. Reaching through Nginx would be circular - Nginx
    # waits on this container - and would report a healthy app as sick whenever the
    # proxy in front of it was the thing that was broken.
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pulllens

  # Laravel Horizon processes Redis-backed queues for asynchronous AI review jobs.
  horizon:
    <<: [*laravel-env, *laravel-image, *laravel-build]
    container_name: pulllens-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - pulllens_storage:/var/www/html/storage
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pulllens

  # Laravel scheduler runs scheduled tasks once per minute without needing host cron.
  scheduler:
    <<: [*laravel-env, *laravel-image, *laravel-build]
    container_name: pulllens-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - pulllens_storage:/var/www/html/storage
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Proving the framework still boots is all a health check can honestly say about a
    # loop that shells out once a minute. The old check reached through Nginx, which
    # this container neither serves nor depends on.
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version >/dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks:
      - pulllens

  # Obtains and renews the Let's Encrypt certificate when HTTPS is terminated inside
  # the stack. Idle and harmless until install_tls.sh has issued one: with no
  # certificate to renew, `certbot renew` exits successfully having done nothing.
  #
  # Operators who terminate TLS somewhere else - Cloudflare, a company load balancer,
  # or the host Nginx that install_ssl.sh sets up - never run install_tls.sh, and this
  # container simply has nothing to do.
  certbot:
    image: certbot/certbot:latest
    container_name: pulllens-certbot
    restart: unless-stopped
    volumes:
      - pulllens_certs:/etc/letsencrypt
      - pulllens_acme:/var/www/certbot
    # Renewal is checked twice a day rather than once, because Let's Encrypt asks that
    # the schedule be randomised and a single daily run on every PullLens instance
    # would land at the same moment everywhere.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - pulllens

  # PostgreSQL stores application data, repositories, webhook logs, review runs, and findings.
  pgsql:
    image: postgres:17-alpine
    container_name: pulllens-pgsql
    restart: unless-stopped
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pulllens}
      POSTGRES_USER: ${DB_USERNAME:-pulllens}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pulllens_pgsql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pulllens} -d ${DB_DATABASE:-pulllens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulllens

  # Valkey provides (Redis-compatible) queues, Horizon, cache, sessions, and fast background processing.
  redis:
    image: valkey/valkey:8-alpine
    container_name: pulllens-redis
    restart: unless-stopped
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - pulllens_redis:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulllens

  # Soketi provides a Laravel-compatible WebSocket server for realtime dashboard updates.
  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    container_name: pulllens-soketi
    restart: unless-stopped
    ports:
      - "${SOKETI_FORWARD_PORT:-6001}:6001"
    environment:
      SOKETI_DEBUG: ${SOKETI_DEBUG:-0}
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-pulllens}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-pulllens-local-key}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-pulllens-local-secret}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PUSHER_PORT:-6001} >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pulllens

# The application network keeps all PullLens containers isolated and addressable by service name.
networks:
  pulllens:
    driver: bridge

# Named volumes persist database and Redis data across restarts.
volumes:
  # Rebuilt from the image on every start by the `assets` service, so it holds no state
  # worth keeping - it exists only to hand the compiled frontend to Nginx.
  pulllens_public:
    driver: local
  # Let's Encrypt's account key, certificates and renewal configuration. This one IS
  # state: losing it means re-issuing, and Let's Encrypt rate-limits that.
  pulllens_certs:
    driver: local
  # The ACME challenge webroot. Nginx serves it, certbot writes to it; it holds nothing
  # between challenges.
  pulllens_acme:
    driver: local
  pulllens_pgsql:
    driver: local
  pulllens_redis:
    driver: local
  pulllens_storage:
    driver: local
